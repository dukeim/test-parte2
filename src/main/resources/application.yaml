server:
  port: 80

# Si APP_DB_FROM_SSM=true (default), SsmDataSourceConfig define el DataSource.
# Si APP_DB_FROM_SSM=false, Spring Boot usa estas propiedades (útil local/tests).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Prop flag to enable/disable SSM resolution
app:
  db:
    resolveFromSsm: ${APP_DB_FROM_SSM:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
