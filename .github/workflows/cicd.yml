name: CI/CD Pipeline - Employee Service

on:
  push:
    branches:
      - develop
      - release
      - master

jobs:
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run Unit Tests
        run: ./mvnw -B test

  integration_tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: unit_tests
    services:
      mysql:
        image: mysql:8.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: appdb
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Wait for MySQL
        run: sleep 20
      - name: Run Integration Tests
        run: ./mvnw -B verify -DskipUnitTests

  docker_build_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: integration_tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_DEV }}

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Artifact version: $VERSION"

      - name: Determine environment and ECR repo
        run: |
          BRANCH="${GITHUB_REF##*/}"

          if [[ "$BRANCH" == "develop" ]]; then
            echo "ECR_REPO_NAME=dev-employee-service" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.AWS_REGION_DEV }}" >> $GITHUB_ENV
          elif [[ "$BRANCH" == "release" ]]; then
            echo "ECR_REPO_NAME=qa-employee-service" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_QA }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.AWS_REGION_QA }}" >> $GITHUB_ENV
          else
            echo "ECR_REPO_NAME=prod-employee-service" >> $GITHUB_ENV
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.AWS_REGION_PROD }}" >> $GITHUB_ENV
          fi

          echo "IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}:${VERSION}" >> $GITHUB_ENV
          echo "🌎 Full image URI: ${IMAGE_URI}"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      - name: Check if version already exists in ECR
        run: |
          echo "🔍 Checking if version $VERSION already exists in ECR..."

          EXISTING_TAG=$(aws ecr describe-images \
            --repository-name ${ECR_REPO_NAME} \
            --region ${AWS_REGION} \
            --query "imageDetails[].imageTags[]" \
            --output text | tr '\t' '\n' | grep -x "$VERSION" || true)

          if [ "$EXISTING_TAG" = "$VERSION" ]; then
            echo "🚫 Version $VERSION already exists in ${ECR_REPO_NAME}."
            exit 1
          else
            echo "✅ Version $VERSION not found in ECR, proceeding with build."
          fi

      - name: Build Docker image
        run: docker build -t $IMAGE_URI .

      - name: Push Docker image to ECR
        run: docker push $IMAGE_URI

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker_build_push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_DEV }}

      - name: Update ECS Service
        run: |
          echo "🚀 Triggering ECS deployment..."
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment
