name: CI/CD Pipeline - Employee Service

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - release
      - master
    paths-ignore:
      - '.github/workflows/cicd.yml'
      - 'README.md'
      - '**/*.md'
  pull_request:
    branches:
      - develop
      - release
      - master
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/cicd.yml'
      - 'README.md'
      - '**/*.md'
env:
  IMAGE_NAME: employee-service

jobs:
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw -B clean package -DskipTests

  unit_tests:
    name: Run Unit Tests e Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run Unit Tests
        run: chmod +x mvnw && ./mvnw -B test

  docker_build_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: integration_tests
    environment: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'release' && 'qa' || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Artifact version: $VERSION"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Check if version already exists in ECR
        run: |
          echo "🔍 Checking if version $VERSION already exists in ECR..."
          EXISTING_TAG=$(aws ecr describe-images \
            --repository-name ${{ env.IMAGE_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --query "imageDetails[].imageTags[]" \
            --output text | tr '\t' '\n' | grep -x "$VERSION" || true)
          if [ "$EXISTING_TAG" = "$VERSION" ]; then
            echo "🚫 Version $VERSION already exists in ${{ env.IMAGE_NAME }}."
            exit 1
          else
            echo "✅ Version $VERSION not found in ECR, proceeding with build."
          fi

      - name: Build Docker image
        run: |
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}:$VERSION
          echo "🏗️ Building $IMAGE_URI"
          docker build -t $IMAGE_URI .

      - name: Push Docker image to ECR
        run: |
          docker push $IMAGE_URI

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker_build_push
    if: ${{ false || github.event_name == 'push'}}
    environment: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'release' && 'qa' || 'prod' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update ECS Service
        run: |
          echo "🚀 Triggering ECS deployment..."
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment
