name: CI/CD Pipeline - Employee Service

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - release
      - master
    paths-ignore:
      - '.github/workflows/cicd.yml'
      - 'README.md'
      - '**/*.md'
  pull_request:
    branches:
      - develop
      - release
      - master
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/cicd.yml'
      - 'README.md'
      - '**/*.md'
env:
  IMAGE_NAME: employee-service

jobs:
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw -B clean package -DskipTests

  tests:
    name: Run Unit Tests e Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run Unit Tests
        run: chmod +x mvnw && ./mvnw -B test

  docker_build_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    #needs: tests
    environment: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'release' && 'qa' || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Extract version from pom.xml
        id: version
        run: |
          chmod +x mvnw
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Artifact version: $VERSION"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Check if version already exists in ECR
        run: |
          echo "🔍 Checking if version $VERSION already exists in ECR..."
          EXISTING_TAG=$(aws ecr describe-images \
            --repository-name ${{ env.IMAGE_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --query "imageDetails[].imageTags[]" \
            --output text | tr '\t' '\n' | grep -x "$VERSION" || true)
          if [ "$EXISTING_TAG" = "$VERSION" ]; then
            echo "🚫 Version $VERSION already exists in ${{ env.IMAGE_NAME }}."
            exit 1
          else
            echo "✅ Version $VERSION not found in ECR, proceeding with build."
          fi

      - name: Build Docker image
        run: |
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}:$VERSION
          echo "🏗️ Building $IMAGE_URI"
          docker build -t $IMAGE_URI .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Ensuring ECR repository exists
        run: |
          echo "🔍 Checking if ECR repo ${IMAGE_NAME} exists..."
          if ! aws ecr describe-repositories --repository-names "${IMAGE_NAME}" > /dev/null 2>&1; then
            echo "🪄 Repository ${IMAGE_NAME} not found — creating it..."
            aws ecr create-repository --repository-name "${IMAGE_NAME}" \
              --image-scanning-configuration scanOnPush=true \
              --region "${AWS_REGION}"
            echo "✅ Repository ${IMAGE_NAME} created."
          else
            echo "✅ Repository ${IMAGE_NAME} already exists."
          fi
          
      - name: Push Docker image to ECR
        run: |
          echo "Pushing $IMAGE_URI"
          docker push $IMAGE_URI

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker_build_push
    if: ${{ github.event_name == 'push' }}
    environment: ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'release' && 'qa' || 'prod' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update ECS Service
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services ${{ vars.ECS_SERVICE_NAME }} \
            --query "services[0].taskDefinition" \
            --output text)

          # Quitar todo después de los dos puntos finales (:revision)
          TASK_DEF_NAME=${TASK_DEF_ARN%:*}
          echo "Task Definition Name: $TASK_DEF_NAME"
          
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_DEF_NAME)

          NEW_TASK_DEF=$(echo "$TASK_DEF_JSON" | \
            jq --arg IMAGE "$IMAGE_URI" \
               '.taskDefinition | 
                .containerDefinitions[0].image = $IMAGE |
                del(.status, .revision, .taskDefinitionArn, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          echo "$NEW_TASK_DEF" > new-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "🆔 New task definition ARN: $NEW_TASK_DEF_ARN"

          echo "🚀 Triggering ECS deployment..."
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service ${{ vars.ECS_SERVICE_NAME }} \
            --task-definition $NEW_TASK_DEF_ARN